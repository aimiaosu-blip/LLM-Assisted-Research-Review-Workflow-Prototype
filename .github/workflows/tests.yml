name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m reviewflow run --out runs/ci
      - run: python -m reviewflow verify --out runs/ci
      - run: python demo/run_v4.py --out runs/v4-ci
      - run: python -m reviewflow retest docs/examples/v4/regression/retention.json
      - run: python -m reviewflow.benchmark --out runs/benchmark
      - run: python examples/run_workflow.py --out runs/workflow-demo
